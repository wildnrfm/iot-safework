[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "safework-ai"
version = "0.1.0"
description = "Local PPE inspection station with YOLO, FastAPI, and ESP32 indicators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "numpy",
    "opencv-python>=4.8",
    "pyserial>=3.5",
]

[project.optional-dependencies]
ai = ["ultralytics>=8.3"]
dev = [
    "ruff>=0.8",
    "httpx2>=2.16",
]

[project.scripts]
safework = "safework.__main__:main"

[tool.setuptools.packages.find]
include = ["safework*", "tests*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
